[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinpop"
version = "0.1.0"
description = "Población sintética de las personas adultas residentes en España"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Uso no comercial (D-007)" }
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
sinpop = "sinpop.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
