# Diccionario armonizado (docs/02_datos_y_variables.md, sección 3).
# F0: nombres, prioridades y categorías propuestas por la documentación.
# F1 (2026-10-14): `fuentes` = matriz de cobertura (variable original en cada fuente,
# verificada contra el diseño de registro). La recodificación se añade en F2.
# Valores especiales: NS, NC y NP son categorías explícitas, nunca valores de escala.
# intencion_voto y valoracion_lideres NO son atributos de la persona (D-005).

variables:
  edad:
    prioridad: P0
    nivel: persona
    tipo: numerica
    rango:
    - 0
    - 120
    descripcion: Años cumplidos
    fuente_principal: censo / padron_continuo
    fuentes:
      censo2021_micro_hogares:
        variable_original: VAREDAD
        verificado_contra: dr_CensoPersonas_2021.xlsx (INE)
      censo_anual_micro_completo:
        variable_original: VAREDAD
        verificado_contra: dr_CensoAnual_muestra_2022.xlsx (INE, versión 2025)
      censo_anual_micro_demograficas:
        variable_original: VAREDAD
        verificado_contra: dr_CensoAnual_2026.xlsx (INE)
      ecp:
        variable_original: Edad (tablas 59589, 60129)
        verificado_contra: INEbase, API Tempus
      ecv:
        variable_original: RB082
        verificado_contra: disreg_ecv25 (INE)
      epa:
        variable_original: EDAD1
        verificado_contra: dr_EPA_2026.xlsx (INE)
        notas: grupos quinquenales
      tic_h:
        variable_original: EDAD
        verificado_contra: dr_TICHcuestionario_2025.xlsx (INE)
      encuesta_salud:
        variable_original: EDADa
        verificado_contra: dr_ESdEadulto_2023.xlsx (INE)
  edad_5:
    prioridad: P0
    nivel: persona
    tipo: ordinal
    descripcion: Tramos quinquenales de edad (el tramo abierto superior se verifica en F3 con el Padrón)
    categorias:
    - 00-04
    - 05-09
    - 10-14
    - 15-19
    - 20-24
    - 25-29
    - 30-34
    - 35-39
    - 40-44
    - 45-49
    - 50-54
    - 55-59
    - 60-64
    - 65-69
    - 70-74
    - 75-79
    - 80-84
    - 85-89
    - 90+
    fuente_principal: censo / padron_continuo
    derivada_de: edad
    fuentes:
      censo2021_micro_hogares:
        variable_original: VAREDAD
        verificado_contra: dr_CensoPersonas_2021.xlsx (INE)
      ecp:
        variable_original: Edad
        verificado_contra: INEbase, API Tempus
      censo_anual_micro_demograficas:
        variable_original: VAREDAD
        verificado_contra: dr_CensoAnual_2026.xlsx (INE)
  edad_4:
    prioridad: P0
    nivel: persona
    tipo: ordinal
    descripcion: Tramos amplios de edad para adultos (NP para menores de 18)
    categorias:
    - 18-34
    - 35-49
    - 50-64
    - 65+
    fuente_principal: censo / padron_continuo
    derivada_de: edad
    fuentes:
      censo2021_micro_hogares:
        variable_original: VAREDAD
        verificado_contra: dr_CensoPersonas_2021.xlsx (INE)
      ecp:
        variable_original: Edad
        verificado_contra: INEbase, API Tempus
      censo_anual_micro_demograficas:
        variable_original: VAREDAD
        verificado_contra: dr_CensoAnual_2026.xlsx (INE)
  sexo:
    prioridad: P0
    nivel: persona
    tipo: categorica
    categorias:
    - hombre
    - mujer
    descripcion: Sexo según registro
    fuente_principal: censo / padron_continuo
    fuentes:
      censo2021_micro_hogares:
        variable_original: SEXO
        verificado_contra: dr_CensoPersonas_2021.json (INE)
        recodificacion: &id001
          '1': hombre
          '6': mujer
      censo_anual_micro_completo:
        variable_original: SEXO
        verificado_contra: dr_CensoAnual_muestra_2022.xlsx (INE)
        recodificacion: *id001
      censo_anual_micro_demograficas:
        variable_original: SEXO
        verificado_contra: dr_CensoAnual_2026.json (INE)
        recodificacion: *id001
      ecp:
        variable_original: Sexo
        verificado_contra: INEbase, API Tempus
      ecv:
        variable_original: RB090
        verificado_contra: disreg_ecv25 / dr_ECV_SM_T*_2025.json (INE)
        recodificacion:
          '1': hombre
          '2': mujer
      epa:
        variable_original: SEXO1
        verificado_contra: dr_EPA_2026.json (INE)
        recodificacion:
          '1': hombre
          '6': mujer
      tic_h:
        variable_original: SEXO
        verificado_contra: dr_TICHcuestionario_2025.json (INE)
        recodificacion:
          '1': hombre
          '6': mujer
      encuesta_salud:
        variable_original: SEXOa
        verificado_contra: dr_ESdEadulto_2023.json (INE)
        recodificacion:
          '1': hombre
          '2': mujer
