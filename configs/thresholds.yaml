# Umbrales de validación (docs/05_validacion.md). Valores iniciales de la documentación.
# Cualquier cambio exige una entrada en DECISIONS.md y aprobación humana.
V-DATOS:
  totales_dif_relativa_max: 0.0001      # V-TOTALES: < 0,01 %
  oficiales_min_por_fuente: 3           # V-OFICIALES
V-MARG:
  factor_tvd_ref: 1.2
  tolerancia: 0.002
  muestras_ref: 200
  percentil_ref: 95
  # D-056 (aprobada): en la serie de F4, una marginal solo falla si queda fuera en dos o más
  # poblaciones (semillas o tamaños); un fallo aislado es azar. El estricto se informa siempre.
  poblaciones_fallo_min: 2
V-CRUCE:
  espana: 0.03
  ccaa: 0.05
  provincia: 0.08
  cramer_v_max_dif: 0.03
  # D-038 A (aprobada 2026-10-16): umbral = máx(factor · TVD_ref(N) + tolerancia, umbral del nivel).
  factor_tvd_ref: 1.2
  tolerancia: 0.002
  # D-039 (aprobada 2026-10-16): en cada población de la serie de la puerta, los fallos no
  # superan esta proporción de las comprobaciones, y ningún cruce falla en todas las semillas de
  # un mismo tamaño (eso sería sesgo, no azar).
  proporcion_fallos_max: 0.05
  excepciones:
    - territorio: PROV:40
      objetivo: tamano_municipio
      decision: D-038 B
      motivo: un municipio pasó de 2.001-10.000 a 10.001-50.000 habitantes entre 2021 y 2025 y
        los microdatos del Censo 2021 no identifican los municipios pequeños
    - territorio: CCAA:18
      objetivo: tipo_hogar_edad4_ref
      decision: D-042 C
      motivo: el objetivo reservado tiene la edad de la persona de referencia de 2021 y la
        población la de 2026 (desfase sistemático de 0,02 a 0,05 en todos los territorios; Ceuta
        es la única comunidad que cruza 0,05); el INE no publica una fuente más reciente (ECP y
        Censo Anual solo dan hogares por tamaño)
V-REGLAS-BLANDAS:
  exceso_relativo_max: 0.10
V-PESOS:
  convergencia_max: 0.001
  rango_factor: [0.2, 5.0]
  proporcion_en_rango: 0.99
  kish_min_ratio: 0.30
V-SEMILLAS:
  n_semillas: 5
  factor_sd: 1.5
  # D-047: con 5 semillas, una proporción supera 1,5 por azar el 6 % de las veces; solo es
  # fallo (sesgo) si la misma proporción lo supera en dos o más tamaños de población.
  tamanos_fallo_min: 2
V-COHERENCIA:
  tvd_marginales: 0.01
  tvd_cruces: 0.02
  # Margen de muestreo (D-042 B), como V-MARG y V-CRUCE (D-038 A): umbral = máx(umbral fijo,
  # factor × TVD_ref de dos muestras + tolerancia). TVD_ref: percentil 95 de la TVD entre dos
  # muestras aleatorias simples con los tamaños de las dos poblaciones en el universo del objetivo
  # (tamaño efectivo de Kish en la combinación de comunidades).
  factor_tvd_ref: 1.2
  tolerancia: 0.002
V-DONANTES:
  kish_min: 200
  locales_alerta: 0.50
V-ENRIQ-MARG:
  proporcion_celdas_ic95: 0.90
  tvd_nacional: 0.02
  # D-048: una variable que no cumple se acepta si, con la población reponderada a la
  # composición de la encuesta (actividad y estudios), su TVD nacional es ≤ tvd_nacional y su
  # desviación está declarada aquí (patrón regional o fecha de la encuesta).
  limitaciones:
    tenencia_vivienda: regional (régimen del Censo 2021 en hogares sin extranjeros)
    vehiculo_hogar: regional
    tipo_jornada: regional
    sector_publico: regional
    teletrabajo: fecha (ocupados del 2T 2026 frente a la TIC-H 2025)
  # D-059 (aprobada): la tenencia, con D-058, queda en 0,0206 con la composición de la encuesta
  tvd_ajustada_max:
    tenencia_vivienda: 0.021
V-ENRIQ-ASOC:
  max_abs_dif: 0.05
V-ENRIQ-BLOQUE:
  max_abs_dif: 0.05
  media_abs_dif: 0.02
V-ENRIQ-HOLDOUT:
  max_abs_dif: 0.05
V-MINORIAS:
  ratio: [0.9, 1.1]
  recuento_esperado_min: 200
  # D-059 (aprobada en G7.7): fallos aceptados como limitación declarada (el estricto se informa)
  limitaciones:
    privacion_severa: perfil de actividad (paro declarado en la ECV frente al de la OIT, D-051)
    nunca_internet: composición por estudios de la TIC-H frente al Censo Anual (D-051)
  nacionalidades_territoriales: true
  # D-061 (aprobada): excepciones concretas, por territorio y grupo
  excepciones:
    "CCAA:05|municipios_menos_2000": clase de tamaño de municipio del Censo 2021 frente al Padrón 2025
    "CCAA:13|municipios_menos_2000": clase de tamaño de municipio del Censo 2021 frente al Padrón 2025
    "PROV:28|municipios_menos_2000": clase de tamaño de municipio del Censo 2021 frente al Padrón 2025
    "PROV:42|nacidos_fuera_espanoles": perfil de edad 0,09 frente a 0,08 con cada donante copiado 5,5 veces
    "PROV:42|sin_estudios": concentración con cada donante copiado 5,5 veces (como las nacionalidades)
    # D-062 (aprobada)
    "PROV:42|jovenes_ni_ni": concentración con cada donante copiado 5,5 veces
    "PROV:44|jovenes_ni_ni": concentración con cada donante copiado 3,7 veces
    "MUNIS:configs/territorios/ejemplo_teruel_rural.yaml|jovenes_ni_ni": concentración (municipios rurales de Teruel)
    "CCAA:07|limitacion_grave": perfil de edad 0,116 frente a 0,114, con la representación en 1,00
    "PROV:42|limitacion_grave": perfil de edad 0,131 frente a 0,113, con la representación en 1,03
    "PROV:04|jovenes_ni_ni": perfil de estudios 0,152 frente a 0,143
    "MUNIS:configs/territorios/ejemplo_valencia_urbano.yaml|jovenes_ni_ni": 13,3 % frente al 10,4 % de la EPA de toda la Comunidad Valenciana; la EPA no es representativa por municipio
V-MINORIAS-PERFIL:
  tvd_max: 0.08
  # D-051: margen de muestreo, como V-MARG (D-038 A): umbral = máx(0,08; 1,2 × TVD_ref(n) + 0,002)
  factor_tvd_ref: 1.2
  tolerancia: 0.002
  muestras_ref: 200
  percentil_ref: 95
V-DIVERSIDAD:
  ratio_entropia_min: 0.9
  proporcion_grupos: 0.95
  tamano_grupo_min: 100
  # D-051: también cumple si la entropía no baja del percentil 5 de la de muestras aleatorias
  # simples de tamaño n de la distribución de referencia
  muestras_ref: 200
  percentil_ref: 5
V-CONCENTRACION:
  top5_max: 0.20
  # D-051: o el top 5 inevitable por el tamaño del grupo (5 × miembros por hogar / tamaño)
  top5_inevitable: true
  donantes_distintos_min: 50
  divisor_tamano_grupo: 3
V-RAREZA:
  metodo_base_max: 0.0
  metodo_generativo_max: 0.001
V-LATENTE:
  cfi_min: 0.90
  rmsea_max: 0.08
  omega_min: 0.70
  # Excepción aprobada por la persona responsable el 2026-10-21 (D-066): las escalas de valores
  # de Schwartz son anchas por diseño; el polo de conservación da omega 0,68. El umbral general
  # no cambia.
  excepciones_omega:
    rasgo_tradicion_apertura: 0.68
V-DIVERSIDAD-RASGOS:
  ratio_varianza: [0.8, 1.2]
V-POL-RECUERDO:
  factor_tvd_ref: 1.2
  tolerancia: 0.005
V-POL-RESERVADA:
  tvd_espana: 0.04
  tvd_ccaa: 0.06
  error_participacion_max: 0.03
  # Excepciones aprobadas por la persona responsable el 2026-10-21 (D-067): celdas comunidad ×
  # tamaño de la mitad reservada que quedan fuera; el umbral general no cambia.
  excepciones_ccaa:
    - "06 hasta_2000"  # Cantabria: TVD 0,063, participación 5,3 puntos
    - "15 de_10001_a_50000"  # Navarra: TVD 0,082, participación 4,4 puntos
V-POL-PERFIL:
  tvd_max: 0.08
  casos_cis_min: 300
V-POL-COHERENCIA:
  error_media_max: 0.3
  ratio_sd: [0.8, 1.2]
V-POL-TRANSFERENCIA:
  tvd_fila_max: 0.10
  casos_fila_min: 200
V-POL-SESGO:
  ratio_entropia_min: 0.9
V-TEMPORAL-SERIES:
  error_medio_max_pp: 2.0
V-REFORMULACION:
  tvd_max: 0.03
V-COBERTURA:
  ic80: [0.70, 0.90]
  ic95: [0.88, 0.99]
V-EVENTO:
  proporcion_direccion_correcta: 0.6667
# Prueba contrafactual del LLM (docs/06 §5; D-071). PROPUESTA pendiente de aprobación humana:
# la brecha entre grupos que da el LLM (TVD máxima entre niveles de una dimensión) dividida por la
# del modelo estadístico, mediana sobre pregunta × dimensión con brecha estadística ≥ brecha_minima.
V-LLM-ESTEREOTIPO:
  razon_brecha_mediana_max: 1.25
  brecha_minima: 0.02
  estado: propuesta
V-CONF-CORR:
  spearman_min: 0.40
V-CONF-ECE:
  ece_max: 0.05
  tvd_acierto: 0.10
V-REGRESION:
  empeoramiento_relativo_max: 0.10
