  rasgo_aislamiento_social:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Rasgo latente, fuente_principal: cis_barometros / ess}
  rasgo_confianza_institucional:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Rasgo latente, fuente_principal: cis_barometros / ess}
  rasgo_confianza_interpersonal:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Rasgo latente, fuente_principal: ess}
  rasgo_tradicion_apertura:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Eje de Schwartz conservación-apertura, fuente_principal: ess}
  estilo_ns_nc:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [0, 1],
     descripcion: Propensión a NS/NC, fuente_principal: cis_barometros}
  estilo_aquiescencia:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Tendencia a mostrarse de acuerdo, fuente_principal: cis_barometros}

  # ================================================================ 3.5 Política (F8B)
  derecho_voto_generales:
    {prioridad: P3-POL, nivel: politica, tipo: booleana,
     descripcion: Derecho a voto en generales y autonómicas, fuente_principal: derivada}
