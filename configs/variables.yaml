  identidad_territorial:
    prioridad: P3
    nivel: opinion
    tipo: ordinal
    descripcion: Escala Linz-Moreno
    dominio_pendiente: "F8A: categorías según el cuestionario del CIS"
    fuente_principal: cis_barometros / centros_autonomicos
  lengua_habitual:
