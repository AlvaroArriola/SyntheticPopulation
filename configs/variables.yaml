  rasgo_confianza_tecnologia:
    {prioridad: P3, nivel: opinion, tipo: numerica, rango: [-10, 10],
     descripcion: Rasgo latente, fuente_principal: cis_barometros / ess}
  rasgo_preocupacion_ambiental:
