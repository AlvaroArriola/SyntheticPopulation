     categorias: [castellano, catalan_valenciano, euskera, gallego, otras, bilingue],
     descripcion: Lengua habitual, fuente_principal: cis_barometros / centros_autonomicos}
  clase_subjetiva:
    {prioridad: P3, nivel: opinion, tipo: ordinal,
     categorias: [alta, media_alta, media, media_baja, baja, obrera],
     descripcion: Clase social subjetiva, fuente_principal: cis_barometros}
  situacion_economica_personal:
    prioridad: P3
    nivel: opinion
    tipo: ordinal
    descripcion: Valoración de la situación económica personal
    dominio_pendiente: "F8A: escala según el cuestionario del CIS"
    fuente_principal: cis_barometros
  medio_informacion_principal:
