# Rasgos latentes de actitud (F8A; docs/02 §3.4, docs/03 §2.4). Ver `src/sinpop/opinion/latentes.py`.
#
# Cada ítem se puntúa por la ETIQUETA de su respuesta en el fichero del CIS, nunca por el código.
# «N.S.», «N.C.» y «No procede» no tienen posición (dato ausente del ítem). Una etiqueta que no
# esté en la escala detiene el proceso: se revisa contra el cuestionario y se añade aquí.
# `numerica`: escalas 0-10 o 1-10, con el número al principio de la etiqueta.
# Un ítem es `VAR: escala` o `VAR: {escala: ..., invertir: true}`. Mayor puntuación = más rasgo.

escalas:
  temor_4: {"Mucho temor": 4, "Bastante temor": 3, "Poco temor": 2, "Ningún temor": 1}
  grado_5: {"Mucho": 5, "Bastante": 4, "Regular": 3, "Poco": 2, "Nada": 1}
  recursos_clima:
    "Cree que deberíamos dedicar más recursos": 1
    "No cree que sea necesario dedicar más recursos": 0
    "(NO LEER) No sabe, está en duda": null
  # «Siempre han ocurrido fenómenos similares» tampoco atribuye la DANA al cambio climático
  # Estudio 3409 (eje territorial, F8B)
  sentimiento_5:
    "Únicamente español/a": 1
    "Más español/a que (gentilicio de C.A.)": 2
    "Tan español/a como (gentilicio de C.A.)": 3
    "Más (gentilicio de C.A.) que español/a": 4
    "Únicamente (gentilicio de C.A.)": 5
    "(NO LEER) Ninguna de las anteriores": null
  orgullo_4: {"Muy orgulloso/a": 1, "Bastante orgulloso/a": 2, "Poco orgulloso/a": 3, "Nada orgulloso/a": 4}
  organizacion_5:
    "Un Estado con un único Gobierno central sin autonomías": 1
    "Un Estado en el que las comunidades autónomas tengan menor autonomía que en la actualidad": 2
    "Un Estado con comunidades autónomas como en la actualidad": 3
    "Un Estado en el que las comunidades autónomas tengan mayor autonomía que en la actualidad": 4
    "Un Estado en el que se reconociese a las comunidades autónomas la posibilidad de convertirse en estados independientes": 5
  atribucion_clima:
    "Creo que es algo que se relaciona con el cambio climático": 1
    "Creo que es un fenómeno totalmente aislado": 0
    "(NO LEER) Siempre han ocurrido fenómenos similares": 0

rasgos:
  # Estudio 3535 (Encuesta sobre tendencias sociales V, noviembre de 2025), P.4: confianza de
  # 1 (mínima) a 10 (máxima) en nueve organizaciones políticas e instituciones.
  # Solo las instituciones no partidistas: partidos, sindicatos, Gobierno y Parlamento forman un
  # segundo factor (confianza partidista, CFI 0,67 con un solo factor), que es la desafección de
  # la capa política (F8B, `rasgo_desafeccion`) (D-065).
  rasgo_confianza_institucional:
    estudios: ["3535"]
    items:
      CONFIANZA_5: numerica  # medios de comunicación
      CONFIANZA_6: numerica  # Justicia
      CONFIANZA_7: numerica  # Constitución de 1978
      CONFIANZA_8: numerica  # Tribunal Constitucional
      CONFIANZA_9: numerica  # organizaciones empresariales
  # Estudio 3554 (Estudio sobre temores en la sociedad actual, marzo de 2026), P.2 y P.2A:
  # miedo de 0 (ninguno) a 10 (máximo). Indicador de la presión del coste de vida (D-065).
  rasgo_sensibilidad_precio:
    estudios: ["3554"]
    items:
      P2_4: numerica  # que su trabajo o pensión no le permitan vivir con dignidad
      P2_10: numerica  # perder su trabajo o no encontrar un trabajo estable
      P2_11: numerica  # no poder pagar su vivienda, alquiler o hipoteca
      P2A_3: numerica  # una crisis económica
  # Estudio 3554: temor a la soledad y a quedarse sin apoyo emocional (D-065). Con tres ítems el
  # modelo propio está exactamente identificado (0 grados de libertad): su ajuste se contrasta en el
  # factorial conjunto con `rasgo_sensibilidad_precio`, del mismo estudio.
  rasgo_aislamiento_social:
    estudios: ["3554"]
    items:
      P2_5: numerica  # temor a la soledad (0-10)
      P2_7: numerica  # no tener a una persona a la que amar (0-10)
      P16: temor_4  # temor a quedarse solo/a o sin apoyo emocional
  # P17 (tiene con quién hablar de sus preocupaciones) no carga en el factor (0,04): se descarta.
  # Estudio 3489 (Barómetro de diciembre de 2024), bloque sobre la DANA y el cambio climático
  # (D-066). El barómetro de marzo de 2023 (3398) tiene otra batería, con tres ítems y omega 0,67.
  rasgo_preocupacion_ambiental:
    estudios: ["3489"]
    items:
      P13: grado_5  # preocupación por el cambio climático
      MEDIDASCLIMA: numerica  # importancia (0-10) de tomar medidas contra sus efectos
      P12: recursos_clima  # dedicar más recursos públicos a fenómenos y desastres naturales
      P7: atribucion_clima  # la DANA se relaciona con el cambio climático
  # Estudio 3495 (Inteligencia artificial, febrero de 2025), P.3: grado (1-10) en que asocia cada
  # palabra a los avances tecnológicos (enunciado en las tablas marginales del CIS). Las palabras
  # positivas forman un factor (D-066); las negativas (deshumanización, riesgos…) miden otra cosa.
  # La batería de beneficios de la IA (P.14) solo la responde quien conoce la IA y no se usa.
  rasgo_confianza_tecnologia:
    estudios: ["3495"]
    items:
      P3_1: numerica  # progreso
      P3_3: numerica  # riqueza
      P3_5: numerica  # eficacia
      P3_10: numerica  # bienestar
  # European Social Survey, ronda 11 (España, 2023), D-066. Ítems ya puntuados por etiqueta en
  # `opinion/ess.py`; la ESS entrevista a residentes de cualquier nacionalidad.
  rasgo_confianza_interpersonal:
    fuente: ess
    estudios: ["ESS11"]
    items:
      ppltrst: ess  # se puede confiar en la mayoría de la gente (0-10)
      pplfair: ess  # la gente intentaría ser justa (0-10)
      pplhlp: ess  # la gente intenta ayudar (0-10)
  # Polo de conservación del eje de Schwartz (seguridad, conformidad y tradición; 1-6, más = más
  # parecido a la persona entrevistada). Mayor puntuación = más tradición, menos apertura.
  # La versión bipolar (ítems centrados en la media de cada persona) ajusta peor (CFI 0,81).
  rasgo_tradicion_apertura:
    fuente: ess
    estudios: ["ESS11"]
    items:
      impsafea: ess  # vivir en un entorno seguro
      ipstrgva: ess  # un Estado fuerte que garantice la seguridad
      ipfrulea: ess  # hacer lo que se le dice y seguir las normas
      ipbhprpa: ess  # comportarse correctamente
      ipmodsta: ess  # ser humilde y modesto
      imptrada: ess  # seguir las tradiciones y costumbres

# Rasgos políticos latentes (F8B; docs/02 §3.5; D-067). Van a `politics.parquet`, nunca a
# `opinion.parquet`. Mismo método que los de F8A; `residuos` declara a priori pares de ítems que
# comparten contenido además del rasgo (sus residuos se correlacionan en el factorial).
rasgos_politicos:
  # European Social Survey, ronda 11 (España, 2023). Autoubicación (lrscale, 0-10), posición
  # del partido votado (autoubicación media 1-10 de su electorado en el CIS, `politics/posiciones`;
  # ausente si no votó a un partido) y actitudes: religiosidad (0-10), apego a España (0-10),
  # rechazo a la adopción por parejas homosexuales y a la redistribución (1-5) e inmigración de otro
  # origen étnico (1-4, más = menos). Autoubicación y posición del partido comparten la
  # identificación partidista: residuos correlacionados. Sin el voto, las actitudes solas dan
  # omega 0,63 (la ideología española está poco estructurada por actitudes).
  rasgo_izquierda_derecha:
    fuente: ess
    estudios: ["ESS11"]
    items:
      lrscale: ess
      posicion_partido_votado: ess
      rlgdgr: ess
      atchctr: ess
      hmsacld: ess
      gincdif: ess
      imdfetn: ess
    residuos: [[lrscale, posicion_partido_votado]]
    predictores_extra: [grupo_voto, ideologia_bloque]
  # ESS11: confianza (0-10) en los políticos, el Parlamento, la justicia y el Parlamento Europeo
  # y satisfacción con la democracia (0-10), invertidas: más = más desafección. La confianza en
  # los partidos se descarta: es casi la misma pregunta que la de los políticos (RMSEA 0,19 con
  # las dos); la satisfacción con el Gobierno, porque depende de quién gobierna.
  rasgo_desafeccion:
    fuente: ess
    estudios: ["ESS11"]
    items:
      confianza_politicos: {escala: ess, invertir: true}
      confianza_parlamento: {escala: ess, invertir: true}
      confianza_justicia: {escala: ess, invertir: true}
      confianza_parlamento_europeo: {escala: ess, invertir: true}
      satisfaccion_democracia: {escala: ess, invertir: true}
    conjunto: actitudes_politicas
    predictores_extra: [grupo_voto]
  # ESS11: interés por la política (1-4) y eficacia política interna: capacidad de participar
  # activamente en un grupo político y confianza en la propia capacidad de participar (1-5).
  # Las siete formas de participación (sí/no) cargan poco (0,33-0,45) y el haber votado 0,16:
  # quedan como variables observadas (`politics/ess_donantes`). Tres ítems: el ajuste se
  # contrasta en el factorial conjunto con la desafección (`conjunto`). Con los tres rasgos de la
  # ESS juntos el ajuste baja (CFI 0,88) por cargas cruzadas de la ideología en la confianza
  # (con un Gobierno de izquierda, la derecha desconfía más), no por la implicación.
  rasgo_implicacion_politica:
    fuente: ess
    estudios: ["ESS11"]
    items:
      interes_politica_puntos: ess
      actrolga: ess
      cptppola: ess
    conjunto: actitudes_politicas
    predictores_extra: [grupo_voto]
  # Estudio 3409 (Identidades culturales, nacionales y europeas, junio de 2023; 7.643 españoles
  # de 18 y más años, todas las comunidades). Más = más autogobierno o periferia:
  # P7_3 identificación con España (0-10, invertida), P10 sentimiento (únicamente español …
  # únicamente de su comunidad), P11 orgullo de ser español (más = menos orgullo) y P13
  # organización territorial preferida (sin autonomías … posibilidad de independencia).
  # Identificación con España y orgullo de ser español comparten objeto: residuos correlacionados.
  # La identificación con la propia comunidad y el orgullo de ella no discriminan (casi todos se
  # identifican con su comunidad, carga 0,16).
  rasgo_eje_territorial:
    estudios: ["3409"]
    items:
      P7_3: {escala: numerica, invertir: true}
      P10: sentimiento_5
      P11: orgullo_4
      P13: organizacion_5
    residuos: [[P7_3, P11]]
    # El campo es anterior a las generales de 2023 (su recuerdo es de 2019): el predictor político
    # es la autoubicación (ESCIDEOL) en bloques, no el voto.
    predictores_extra: [ideologia_bloque]
