     descripcion: Recuerdo de voto en las generales de 2023, fuente_principal: cis_electorales}
  recuerdo_voto_autonomicas:
    {prioridad: P3-POL, nivel: politica, tipo: categorica,
     dominio_pendiente: "F2: según partidos.yaml por comunidad",
