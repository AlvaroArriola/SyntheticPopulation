# Catálogo de fuentes (docs/02_datos_y_variables.md, sección 2).
# Actualizado en F1 (2026-10-14) con lo verificado en la documentación oficial (D-015, D-016).
# La URL exacta y el SHA-256 de cada fichero están en data/raw/MANIFEST.yaml.

fuentes:
- id: padron_continuo
  nombre: Estadística del Padrón Continuo
  organismo: INE
  capa: A
  tipo: tablas
  url_oficial: https://www.ine.es/dyngs/INEbase/listaoperaciones.htm
  edicion: null
  universo: población residente empadronada
  unidad: territorio
  nivel_geografico: municipio
  prioridad: P1
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - sustituida como verdad de referencia por la ECP y el Censo Anual exhaustivo (D-015)
  descarga: automatica
- id: ecp
  nombre: Estadística Continua de Población (cifras de población provisionales trimestrales)
  organismo: INE
  capa: A
  tipo: tablas
  url_oficial: https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/450
  edicion: '2026-01-01'
  universo: población residente (total y en viviendas familiares)
  unidad: territorio
  nivel_geografico: provincia
  prioridad: P0
  descarga: automatica
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - tablas por provincia, sexo, edad y nacionalidad a 01/01/2026 (D-015)
- id: censo_anual_tablas
  nombre: Censo Anual de Población (tablas)
  organismo: INE
  capa: A
  tipo: tablas
  url_oficial: https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/463
  edicion: 2024 (estudios, actividad, estado civil) y 2025 (población)
  universo: población residente
  unidad: territorio
  nivel_geografico: nacional, CCAA, provincia, municipio y sección según tabla
  prioridad: P0
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar: []
  descarga: automatica
- id: censo_anual_micro_demograficas
  nombre: Censo Anual de Población, microdatos de variables demográficas (exhaustivo)
  organismo: INE
  capa: A
  tipo: microdatos
  url_oficial: https://www.ine.es/ftp/microdatos/censoanual/datos_2025.zip
  edicion: '2025'
  universo: toda la población residente a 01/01/2025 (exhaustivo)
  unidad: persona
  nivel_geografico: null
  prioridad: P0
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar: []
  descarga: automatica
- id: censo2021_tablas
  nombre: Censo de Población y Viviendas 2021 (tablas)
  organismo: INE
  capa: A
  tipo: tablas
  url_oficial: https://www.ine.es/dyngs/INEbase/listaoperaciones.htm
  edicion: '2021'
  universo: población residente y hogares
  unidad: territorio
  nivel_geografico: municipio y sección censal
  prioridad: P1
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - los hogares por tamaño y la población en viviendas familiares se toman de la ECP 2026 (D-015)
- id: atlas_renta
  nombre: Atlas de Distribución de Renta de los Hogares
  organismo: INE (estadística experimental)
  capa: A
  tipo: tablas
  url_oficial: https://www.ine.es/dyngs/INEbase/listaoperaciones.htm
  edicion: null
  universo: hogares
  unidad: territorio
  nivel_geografico: municipio, distrito y sección censal
  prioridad: P1
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - último año de renta disponible
- id: degurba
  nombre: Grado de urbanización (DEGURBA)
  organismo: INE y Eurostat
  capa: A
  tipo: tablas
  url_oficial: https://www.ine.es/dyngs/INEbase/listaoperaciones.htm
  edicion: null
  universo: municipios
  unidad: territorio
  nivel_geografico: municipio
  prioridad: P1
  condiciones: 'INE/Eurostat: citar la fuente'
  verificar:
  - incluido en los microdatos censales (TIPO_MUN_DEGURBA / DEGURBA), que es la clasificación que manda la documentación
    (D-015)
- id: censo2021_micro_hogares
  nombre: Censo 2021, microdatos de personas y hogares (muestra del 10 % de hogares)
  organismo: INE
  capa: B
  tipo: microdatos
  url_oficial: https://www.ine.es/ftp/microdatos/censopv/cen21/CensoPersonas_2021.zip
  edicion: '2021'
  universo: personas en viviendas familiares (muestra del 10 % de hogares, con todas sus personas); excluye establecimientos
    colectivos
  unidad: persona_y_hogar
  variable_peso: null
  nivel_geografico: provincia (CPRO); municipio si ≥10.000 hab., si no tamaño (991 ≤2.000, 992 2.001–5.000, 993
    5.001–10.000); grado de urbanización (TIPO_MUN_DEGURBA)
  prioridad: P0
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - 'sin variable de peso: muestra del 10 % de hogares (factor implícito ≈10, a contrastar por provincia en F2)'
  descarga: automatica
- id: censo_anual_micro_completo
  nombre: Censo Anual de Población, microdatos de todas las variables (muestra del 10 %)
  organismo: INE
  capa: B
  tipo: microdatos
  url_oficial: https://www.ine.es/ftp/microdatos/censoanual/vc/datos_muestra_2025.zip
  edicion: 2025 (demografía), 2024 (estudios, actividad, estado civil), 2023 (ocupación y situación profesional)
  universo: población residente (muestra del 10 % de personas; no reconstruye hogares)
  unidad: persona
  variable_peso: null
  nivel_geografico: provincia; municipio si ≥10.000 hab., si no tamaño; DEGURBA
  prioridad: P0
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - sin variable de peso; en la muestra 2024 el Parquet y el JSON del ZIP están desfasados respecto al TXT y al
    Excel (D-016)
  descarga: automatica
- id: censo2021_micro_viviendas
  nombre: Censo 2021, microdatos de viviendas (muestra del 10 %)
  organismo: INE
  capa: B
  tipo: microdatos
  url_oficial: https://www.ine.es/ftp/microdatos/censopv/cen21/CensoViviendas_2021.zip
  edicion: '2021'
  universo: viviendas
  unidad: vivienda
  nivel_geografico: null
  prioridad: P1
  condiciones: 'INE: citar al INE como fuente del dato primario'
  verificar:
  - 'muestra independiente de la de hogares: sin enlace con personas'
  descarga: automatica
- id: ecv
  nombre: Encuesta de Condiciones de Vida
  organismo: INE
  capa: C
