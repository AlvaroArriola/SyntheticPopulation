     dominio_pendiente: "F2: según partidos.yaml + ninguno",
     descripcion: Partido más cercano, fuente_principal: cis_barometros}
  interes_politica:
    {prioridad: P3-POL, nivel: politica, tipo: ordinal,
     categorias: [mucho, bastante, poco, nada],
     descripcion: Interés por la política, fuente_principal: cis_barometros / ess}
  participacion_no_electoral:
    {prioridad: P3-POL, nivel: politica, tipo: categorica,
     dominio_pendiente: "F8B: tipos de participación según la ESS",
     descripcion: Participación política no electoral, fuente_principal: ess}
  confianza_instituciones:
    {prioridad: P3-POL, nivel: politica, tipo: numerica, rango: [0, 10],
     descripcion: Confianza por institución (escala de la fuente), fuente_principal: ess / cis_barometros}
  satisfaccion_democracia:
    {prioridad: P3-POL, nivel: politica, tipo: numerica, rango: [0, 10],
     descripcion: Satisfacción con la democracia, fuente_principal: ess}
  rasgo_izquierda_derecha:
