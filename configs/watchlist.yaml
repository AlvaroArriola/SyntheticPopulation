# Grupos vigilados (docs/06_sesgos_y_minorias.md, sección 2). Ampliable.
# Las expresiones usan los nombres y categorías de configs/variables.yaml.
# Las 15 nacionalidades principales se añaden una a una en F2, cuando
# `nacionalidad_top` tenga su dominio fijado con el Padrón vigente.
grupos:
  - id: mayores_85
    nombre: Personas de 85 años o más
    definicion: "edad >= 85"
    referencia: padron_continuo
    recuento_minimo: 500
    motivo: Pocos donantes; alta presencia en residencias
  - id: mayores_solos
    nombre: Personas de 65+ que viven solas
    definicion: "edad >= 65 and tipo_hogar == 'unipersonal'"
    referencia: censo2021_tablas
    recuento_minimo: 500
    motivo: Soledad; grupo clave en vivienda y cuidados
  - id: nacidos_fuera_espanoles
    nombre: Nacidos fuera de España con nacionalidad española
    definicion: "pais_nacimiento_grupo != 'espana' and nacionalidad_grupo in ['espanola', 'espanola_doble']"
    referencia: censo_anual_tablas
    motivo: Grupo creciente, a menudo invisible
  - id: ceuta_melilla
    nombre: Residentes en Ceuta y Melilla
    definicion: "ccaa in ['18', '19']"
    referencia: padron_continuo
    motivo: Territorios muy pequeños y con perfil propio
  - id: municipios_menos_2000
    nombre: Residentes en municipios de menos de 2.000 habitantes
    definicion: "tamano_municipio == 'hasta_2000'"
    referencia: padron_continuo
    motivo: Ruralidad extrema; pocos donantes en algunas zonas
  - id: islas_no_capitalinas
    nombre: Residentes en islas no capitalinas
    definicion: "municipio in islas_no_capitalinas"
    referencia: padron_continuo
    motivo: Insularidad (solo si se dispone de municipio; lista de municipios a fijar en F3)
  - id: monoparentales
    nombre: Personas en hogares monoparentales
    definicion: "tipo_hogar == 'monoparental'"
    referencia: censo2021_tablas
    motivo: Vulnerabilidad económica
  - id: limitacion_grave
    nombre: Personas con limitación grave
    definicion: "discapacidad_limitacion == 'limitacion_grave'"
    referencia: ecv
    capa: enriquecimiento
    motivo: Grupo frecuentemente invisible
  - id: jovenes_ni_ni
    nombre: Jóvenes de 18 a 24 que ni estudian ni trabajan
    definicion: "edad >= 18 and edad <= 24 and relacion_actividad not in ['ocupado', 'estudiante']"
    referencia: epa
    motivo: Situación vital específica
  - id: parados
    nombre: Personas en paro
    definicion: "relacion_actividad == 'parado'"
    referencia: epa
    motivo: Situación económica
  - id: sin_estudios
    nombre: Personas sin estudios o con primaria incompleta
    definicion: "nivel_estudios <= 'primaria_incompleta'"
    referencia: censo_anual_tablas
    motivo: Brecha educativa y digital (categoría exacta a fijar en F2 con el dominio CNED-A)
  - id: privacion_severa
    nombre: Hogares con privación material severa
    definicion: "privacion_material_severa == True"
    referencia: ecv
    capa: enriquecimiento
    motivo: Pobreza (indicador oficial ECV a verificar en F2)
  - id: nunca_internet
    nombre: Personas que nunca usan internet
    definicion: "uso_internet == 'nunca'"
    referencia: tic_h
    capa: enriquecimiento
    motivo: Brecha digital
  - id: abstencion_generales
    nombre: Abstencionistas en las generales de 2023
    definicion: "recuerdo_voto_generales == 'abstencion'"
    referencia: infoelectoral_resultados
    capa: politica
    motivo: Suelen faltar en las encuestas
  - id: partidos_pequenos_regionalistas
    nombre: Votantes de partidos pequeños y regionalistas
    definicion: "recuerdo_voto_generales_familia in ['nacionalista_regionalista', 'otros']"
    referencia: infoelectoral_resultados
    capa: politica
    motivo: Pocos casos en el CIS
  - id: sin_derecho_voto_generales
    nombre: Residentes sin derecho a voto en generales
    definicion: "derecho_voto_generales == False"
    referencia: censo_electoral
    capa: politica
    motivo: No deben recibir recuerdo de voto; sí tienen opiniones políticas
  - id: sin_ubicacion_ideologica
    nombre: Personas sin ubicación ideológica
    definicion: "ideologia_autoubicacion in ['NS', 'NC']"
    referencia: cis_barometros
    capa: politica
    motivo: Grupo amplio que tiende a desaparecer si se imputa siempre un valor
