# Rasgos latentes de actitud (F8A; docs/02 §3.4, docs/03 §2.4). Ver `src/sinpop/opinion/latentes.py`.
#
# Cada ítem se puntúa por la ETIQUETA de su respuesta en el fichero del CIS, nunca por el código.
# «N.S.», «N.C.» y «No procede» no tienen posición (dato ausente del ítem). Una etiqueta que no
# esté en la escala detiene el proceso: se revisa contra el cuestionario y se añade aquí.
# `numerica`: escalas 0-10 o 1-10, con el número al principio de la etiqueta.
# Un ítem es `VAR: escala` o `VAR: {escala: ..., invertir: true}`. Mayor puntuación = más rasgo.

escalas:
  temor_4: {"Mucho temor": 4, "Bastante temor": 3, "Poco temor": 2, "Ningún temor": 1}
  grado_5: {"Mucho": 5, "Bastante": 4, "Regular": 3, "Poco": 2, "Nada": 1}
  recursos_clima:
    "Cree que deberíamos dedicar más recursos": 1
    "No cree que sea necesario dedicar más recursos": 0
    "(NO LEER) No sabe, está en duda": null
  # «Siempre han ocurrido fenómenos similares» tampoco atribuye la DANA al cambio climático
  atribucion_clima:
    "Creo que es algo que se relaciona con el cambio climático": 1
    "Creo que es un fenómeno totalmente aislado": 0
    "(NO LEER) Siempre han ocurrido fenómenos similares": 0

rasgos:
  # Estudio 3535 (Encuesta sobre tendencias sociales V, noviembre de 2025), P.4: confianza de
  # 1 (mínima) a 10 (máxima) en nueve organizaciones políticas e instituciones.
  # Solo las instituciones no partidistas: partidos, sindicatos, Gobierno y Parlamento forman un
  # segundo factor (confianza partidista, CFI 0,67 con un solo factor), que es la desafección de
  # la capa política (F8B, `rasgo_desafeccion`) (D-065).
  rasgo_confianza_institucional:
    estudios: ["3535"]
    items:
      CONFIANZA_5: numerica  # medios de comunicación
      CONFIANZA_6: numerica  # Justicia
      CONFIANZA_7: numerica  # Constitución de 1978
      CONFIANZA_8: numerica  # Tribunal Constitucional
      CONFIANZA_9: numerica  # organizaciones empresariales
  # Estudio 3554 (Estudio sobre temores en la sociedad actual, marzo de 2026), P.2 y P.2A:
  # miedo de 0 (ninguno) a 10 (máximo). Indicador de la presión del coste de vida (D-065).
  rasgo_sensibilidad_precio:
    estudios: ["3554"]
    items:
      P2_4: numerica  # que su trabajo o pensión no le permitan vivir con dignidad
      P2_10: numerica  # perder su trabajo o no encontrar un trabajo estable
      P2_11: numerica  # no poder pagar su vivienda, alquiler o hipoteca
      P2A_3: numerica  # una crisis económica
  # Estudio 3554: temor a la soledad y a quedarse sin apoyo emocional (D-065). Con tres ítems el
  # modelo propio está exactamente identificado (0 grados de libertad): su ajuste se contrasta en el
  # factorial conjunto con `rasgo_sensibilidad_precio`, del mismo estudio.
  rasgo_aislamiento_social:
    estudios: ["3554"]
    items:
      P2_5: numerica  # temor a la soledad (0-10)
      P2_7: numerica  # no tener a una persona a la que amar (0-10)
      P16: temor_4  # temor a quedarse solo/a o sin apoyo emocional
  # P17 (tiene con quién hablar de sus preocupaciones) no carga en el factor (0,04): se descarta.
  # Estudio 3489 (Barómetro de diciembre de 2024), bloque sobre la DANA y el cambio climático
  # (D-066). El barómetro de marzo de 2023 (3398) tiene otra batería, con tres ítems y omega 0,67.
  rasgo_preocupacion_ambiental:
    estudios: ["3489"]
    items:
      P13: grado_5  # preocupación por el cambio climático
      MEDIDASCLIMA: numerica  # importancia (0-10) de tomar medidas contra sus efectos
      P12: recursos_clima  # dedicar más recursos públicos a fenómenos y desastres naturales
      P7: atribucion_clima  # la DANA se relaciona con el cambio climático
  # Estudio 3495 (Inteligencia artificial, febrero de 2025), P.3: grado (1-10) en que asocia cada
  # palabra a los avances tecnológicos (enunciado en las tablas marginales del CIS). Las palabras
  # positivas forman un factor (D-066); las negativas (deshumanización, riesgos…) miden otra cosa.
  # La batería de beneficios de la IA (P.14) solo la responde quien conoce la IA y no se usa.
  rasgo_confianza_tecnologia:
    estudios: ["3495"]
    items:
      P3_1: numerica  # progreso
      P3_3: numerica  # riqueza
      P3_5: numerica  # eficacia
      P3_10: numerica  # bienestar
